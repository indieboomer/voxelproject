[package]
name = "voxelproject"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.29"
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.25"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
hecs = "0.10"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
egui = "0.27"
egui-winit = "0.27"
egui-wgpu = "0.27"
image = { version = "0.24", default-features = false, features = ["png"] }
rodio = { version = "0.19", default-features = false, features = ["mp3"] }
steamworks = { version = "0.13.1", optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]
steam = ["dep:steamworks"]
