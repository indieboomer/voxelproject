# World API schema -- the single authoritative, machine-readable description
# of the Lua "World API" exposed to sandboxed rule modules (see src/scripting.rs).
#
# This file is the source of truth. Everything else is generated from it by
# tools/gen_world_api.py:
#   - world_api/world_api_readme.md    (full human-readable docs)
#   - world_api/world_api_compact.md   (concise docs, spliced into the LLM
#                                        system prompt -- prompts/system_prompt.txt)
#   - world_api/world_api_stubs.lua    (EmmyLua-style type stubs/autocomplete)
#   - src/world_api_gen.rs             (Rust registry consumed by the
#                                        pre-flight validator, src/world_api_validate.rs)
#
# Edit this file, then run `python tools/gen_world_api.py` and rebuild.
#
# `block_kinds` (the valid strings for any "block kind" parameter/field) is
# NOT hardcoded here -- it's derived by the generator from textures/blocks.csv
# (the block roster's own source of truth) plus the four non-CSV extras
# (air, mud, redstone, crystal), so it can't drift out of sync with the
# actual block system the way a third hand-copied list would.

version: "1.3.0"
title: World API
description: >
  The Lua API exposed to sandboxed rule modules as the `api` table passed
  into on_tick/on_cast/on_death/on_block_break. Every member is flat under
  `api` (single "world" namespace) -- there is no api.player.*/api.world.*
  nesting yet. `namespace: world` is still tagged on each entry so a future
  namespace can be introduced without reshaping this schema or its
  generated artifacts.

engine:
  runtime: "Lua 5.4 via mlua"
  tick_interval_secs: 0.1
  stdlib_allowed: [table, string, math]
  stdlib_removed: [os, io, require, debug, package]
  memory_limit_bytes: 8388608
  time_budget_ms: 5
  instruction_hook_interval: 1000
  isolation: >
    Each module gets its own Lua VM: one module's globals/persistent state
    can never leak into another's, and a crashed module cannot corrupt the
    rest. A module that exceeds its time/instruction/memory budget, or
    throws any runtime error (including from a call this schema documents
    as budget-limited, once every call in the same tick has already
    consumed its own separate budget), is automatically disabled; the host
    is notified with the error so a rule going silently dark is never
    mistaken for "nothing happened".

authority: >
  Every World API call executes ONLY on the host -- Lua does not run on
  joined clients at all (ScriptHost is host-only state). A module's effects
  (block edits, creature spawns/state, weather, time of day, broadcasts,
  item grants, player attributes) reach clients purely through the
  replication channels below;
  there is no separate "multiplayer mode" a rule opts into. Only the host
  can generate, activate, or run a module (a menu/UI restriction, not
  something this API itself enforces or exposes) -- so an on_cast's
  `event.player_id` is currently always the host's own id, even though the
  API shape allows for any player.

replication:
  block_edits: "Reliable, ordered, resent until acknowledged (ReliableMsg::BlockEdit) -- guaranteed delivery, may lag under packet loss."
  creature_state: "Best-effort, ~20 Hz (UnreliableMsg::Snapshot) -- a dropped snapshot is superseded by the next; no guaranteed delivery, but self-healing within one snapshot interval."
  weather_and_time_of_day: "Carried in the same best-effort Snapshot as creature state -- see creature_state."
  broadcast_messages: "One reliable Notify message per api.broadcast call, the same path used for host system notifications (rule enabled/disabled, player joined, etc.)."
  item_grants: "One reliable, targeted ReliableMsg::GrantItem per give_item call, sent only to the named player_id (not broadcast to everyone like Notify) -- the host applies its own grant locally instead of round-tripping through the network."
  player_attributes: "health, poisoned, speed_multiplier, and jump_multiplier all ride the same best-effort Snapshot creature_state already uses (~20Hz, self-healing) -- broadcast to every connected player, not just the one they belong to, the same way carrying_crystal already is. A player's own client also applies its own speed_multiplier/jump_multiplier from this to its local movement physics, since movement itself is simulated client-side."

persistence:
  saved_fields: [name, prompt, source, enabled]
  save_format: "bincode, inside WorldSave.modules (see save.rs) -- ModuleSaveEntry's field set is part of the save file's binary layout, so it cannot gain/lose/reorder fields without breaking old saves; see the changelog for how to evolve it safely."
  not_saved: >
    A module's Lua runtime state (persistent global tables/variables used to
    remember things between calls, e.g. a "previous tick" table keyed by
    player id) is NOT saved. Reloading a world re-executes `source` from
    scratch in a fresh Lua VM, so any such memory resets to its initial
    value -- only a module's enabled/disabled flag and source code survive
    a save/reload, never its accumulated runtime state.
  instant_vs_rule: >
    Whether a module is a RULE or an INSTANT SPELL is NOT a saved field --
    like api_version_tagging below, it's derived every load by re-executing
    `source` and checking which of on_tick/on_cast it defines
    (Module::is_instant). This is deliberate, following the same
    ModuleSaveEntry-stays-frozen discipline api_version_tagging established:
    it keeps the two kinds fully interchangeable in the save format and
    means this feature needed zero changes to WorldSave's bincode layout.
  player_state_not_saved: >
    health, poisoned, speed_multiplier, jump_multiplier, and Resources
    inventory counts are NOT saved with the world, the same way a module's
    Lua runtime state isn't (see not_saved above) -- every player starts
    every session at full health (100), unpoisoned, with 1.0 multipliers,
    and an empty inventory, regardless of how the previous session ended.
    This was already true for the inventory before this API version; health/
    poisoned/multipliers are new state introduced alongside it and follow
    the same precedent rather than becoming the first per-player state that
    does persist.
  api_version_tagging: >
    Every module's `source` may begin with a `-- api_version: X.Y.Z` comment
    line recording which World API version it was written/generated
    against. Rules generated by the LLM pipeline always get this tag added
    automatically; hand-written starter rules under modules/ carry it too.
    It is informational only (never enforced/validated against the running
    engine's version) so that older untagged rules keep loading exactly as
    before -- see CHANGELOG.md.

budgets:
  block_edits_per_call:
    value: 32
    scope: "per module, per on_tick/on_death/on_block_break call"
    applies_to: [replace_block]
    on_exhausted: "replace_block returns false; not an error."
  creature_spawns_per_call:
    value: 4
    scope: "per module, per call"
    applies_to: [spawn_creature, spawn_creature_near_player]
    on_exhausted: "the call returns nil; not an error."
  find_radius_max:
    value: 10.0
    applies_to: [find_creatures, find_blocks, spawn_creature_near_player]
    note: >
      find_creatures/find_blocks clamp their radius argument into [0, 10];
      spawn_creature_near_player clamps into [1, 10] (its floor is 1, not
      0). nearest_creature/nearest_player take no radius at all -- they
      search every creature/player unconditionally and return the closest.
  find_results_max:
    value: 64
    applies_to: [find_creatures, find_blocks]
    on_exceeded: "results beyond the cap are silently dropped, not an error; don't rely on finding more than this."
  block_edits_per_cast_call:
    value: 300
    scope: "per instant-spell module, per on_cast call -- higher than block_edits_per_call since a spell runs once, not ~10/sec"
    applies_to: [replace_block]
    on_exhausted: "replace_block returns false; not an error."
  creature_spawns_per_cast_call:
    value: 30
    scope: "per instant-spell module, per on_cast call -- higher than creature_spawns_per_call since a spell runs once, not ~10/sec"
    applies_to: [spawn_creature, spawn_creature_near_player]
    on_exhausted: "the call returns nil; not an error."
  item_grant_max:
    value: 500
    scope: "per give_item call -- caps the amount argument itself, not a call count"
    applies_to: [give_item]
    on_exceeded: "amount is silently clamped to this value, not an error."
  attribute_multiplier_min:
    value: 0.1
    applies_to: [set_player_speed, set_player_jump]
    note: "A multiplier below this (e.g. 0) would functionally freeze/disable the attribute; clamped instead of allowed."
  attribute_multiplier_max:
    value: 5.0
    applies_to: [set_player_speed, set_player_jump]
    on_exceeded: "multiplier is silently clamped into [attribute_multiplier_min, attribute_multiplier_max], not an error."
  max_health:
    value: 100.0
    scope: "every player, fixed -- not per-kind like a creature's max_health"
    applies_to: [heal_player]
    note: "Also the starting health for every player, every session (see persistence.player_state_not_saved)."
  poison_tick_secs:
    value: 10.0
    scope: "global -- how often every currently-poisoned player loses health, engine-driven, not a Lua call"
    applies_to: [set_poisoned]
    note: "1 health lost per tick, for as long as PlayerSnapshot.poisoned stays true. No Lua callback fires for this -- it's pure engine state, only observable by polling api.players()/nearest_player().health from on_tick."

creature_kinds: [sheep, chicken, stone_golem]

# ---------------------------------------------------------------------------
# Shared table shapes returned by queries / passed to event handlers.
# ---------------------------------------------------------------------------
types:
  PlayerSnapshot:
    desc: "One connected player's state, as returned by players()/nearest_player()."
    fields:
      - {name: id, type: integer, desc: "Stable per-connection player id; 0 is always the host."}
      - {name: x, type: number}
      - {name: y, type: number}
      - {name: z, type: number}
      - {name: carrying_crystal, type: boolean, desc: "True once this player has ever broken a Crystal block this session. One-shot: never resets to false from this API (there is no 'drop crystal' action)."}
      - {name: speed, type: number, desc: "Horizontal speed in blocks/sec -- excludes vertical (fall/jump) motion."}
      - {name: vertical_speed, type: number, desc: "Signed vertical speed: positive while rising (e.g. jumping), negative while falling."}
      - {name: on_ground, type: boolean, desc: "True when standing on solid ground. Never true the same tick vertical_speed is positive -- a jump sets both at once, so 'on_ground and vertical_speed > 0' can never be true. There is no separate on_jump/on_land event; detect a one-shot transition by remembering the previous tick's on_ground per player id."}
      - {name: running, type: boolean, desc: "True while sprinting, as opposed to walking."}
      - {name: in_water, type: boolean, desc: "True while standing in a water block."}
      - {name: health, type: number, desc: "0-100. Starts at 100 for every player every session -- like resources, health is NOT saved/reloaded with the world (see persistence.player_state_not_saved)."}
      - {name: poisoned, type: boolean, desc: "While true, this player loses 1 health every poison_tick_secs, until something sets it back to false (e.g. a future medication item -- see set_poisoned). Sourced from and reported through this flag only; there is no separate 'poison timer' exposed."}
      - {name: speed_multiplier, type: number, desc: "Multiplies this player's base walk/sprint speed. 1.0 = normal; see set_player_speed."}
      - {name: jump_multiplier, type: number, desc: "Multiplies this player's base jump speed (so roughly jump *height* scales with its square, not linearly). 1.0 = normal; see set_player_jump."}
  PlayerSnapshotWithDistance:
    desc: "PlayerSnapshot plus the straight-line distance from the query point, as returned by nearest_player()."
    extends: PlayerSnapshot
    adds:
      - {name: distance, type: number}
  CreatureSnapshot:
    desc: "One creature's state, as returned by creatures()/find_creatures()."
    fields:
      - {name: id, type: integer, desc: "Stable creature id, valid until it despawns (destroy/damage-to-zero)."}
      - {name: kind, type: string, enum_ref: creature_kinds}
      - {name: x, type: number}
      - {name: y, type: number}
      - {name: z, type: number}
      - {name: health, type: number}
      - {name: max_health, type: number, desc: "Fixed per kind (sheep 12, chicken 6, stone_golem 40); never changes at runtime."}
  CreatureSnapshotWithDistance:
    desc: "CreatureSnapshot plus distance from the query point, as returned by nearest_creature()."
    extends: CreatureSnapshot
    adds:
      - {name: distance, type: number}
  BlockPos:
    desc: "One integer world position, as returned by find_blocks()."
    fields:
      - {name: x, type: integer}
      - {name: y, type: integer}
      - {name: z, type: integer}
  CastEvent:
    desc: "Passed as `event` to on_cast."
    fields:
      - {name: player_id, type: integer, desc: "id of the player who clicked Run (matches PlayerSnapshot.id). Only the host can run a spell, so this is currently always the host's id, but treat it as any connected player's id -- don't hardcode 0."}
  DeathEvent:
    desc: "Passed as `event` to on_death. The creature no longer exists by the time this fires."
    fields:
      - {name: kind, type: string, enum_ref: creature_kinds}
      - {name: x, type: number, desc: "Last position before death."}
      - {name: y, type: number}
      - {name: z, type: number}
  BlockBreakEvent:
    desc: "Passed as `event` to on_block_break. Only real player-caused breaks (mining) fire this -- a rule's own replace_block calls never do, even ones that set a block to air."
    fields:
      - {name: kind, type: string, desc: "Snake_case id of the block that was broken -- see block_kinds. Same vocabulary as get_block's return value."}
      - {name: x, type: integer}
      - {name: y, type: integer}
      - {name: z, type: integer}
      - {name: player_id, type: integer, desc: "id of the player who broke it (matches PlayerSnapshot.id)."}

# ---------------------------------------------------------------------------
# Read-only fields on the `api` table itself.
# ---------------------------------------------------------------------------
properties:
  - name: time_of_day
    namespace: world
    type: number
    range: "[0, 1)"
    desc: "0 = sunrise, 0.25 = noon, 0.5 = sunset, 0.75 = midnight."
    since: "1.0.0"
  - name: is_night
    namespace: world
    type: boolean
    desc: "True once the sun is below the horizon (matches the point the sky finishes fading to full night)."
    since: "1.0.0"
  - name: weather
    namespace: world
    type: string
    enum: [clear, rain]
    desc: "Current weather."
    since: "1.0.0"

# ---------------------------------------------------------------------------
# Callable functions on the `api` table.
# ---------------------------------------------------------------------------
methods:
  # -- Queries --
  - name: players
    namespace: world
    category: query
    summary: "Every connected player."
    params: []
    returns: {type: "PlayerSnapshot[]", desc: "Empty array if nobody is connected."}
    errors: []
    since: "1.0.0"

  - name: nearest_player
    namespace: world
    category: query
    summary: "The single closest connected player to a point. Prefer this over looping players() yourself when you just need the closest one."
    params:
      - {name: x, type: number}
      - {name: y, type: number}
      - {name: z, type: number}
    returns: {type: "PlayerSnapshotWithDistance | nil", desc: "nil if no players are connected."}
    errors: []
    since: "1.0.0"

  - name: creatures
    namespace: world
    category: query
    summary: "Every creature in the world."
    params: []
    returns: {type: "CreatureSnapshot[]", desc: "Empty array if none exist."}
    errors: []
    since: "1.0.0"

  - name: find_creatures
    namespace: world
    category: query
    summary: "Creatures of one kind within a radius of a point."
    params:
      - {name: kind, type: string, enum_ref: creature_kinds, desc: "\"sheep\", \"chicken\", \"stone_golem\", or \"any\". An unrecognized string is treated the same as \"any\" -- it is NOT an error, so a typo silently matches every creature instead of failing loudly."}
      - {name: cx, type: number}
      - {name: cy, type: number}
      - {name: cz, type: number}
      - {name: radius, type: number, desc: "Clamped into [0, find_radius_max]."}
    returns: {type: "CreatureSnapshot[]", desc: "Up to find_results_max entries; excess matches are silently dropped."}
    errors: []
    budget_ref: find_radius_max
    since: "1.0.0"

  - name: nearest_creature
    namespace: world
    category: query
    summary: "The single closest creature of one kind to a point. No radius argument -- it searches every creature in the world unconditionally."
    params:
      - {name: kind, type: string, enum_ref: creature_kinds, desc: "\"sheep\", \"chicken\", \"stone_golem\", or \"any\" -- same unrecognized-string-means-any behavior as find_creatures."}
      - {name: x, type: number}
      - {name: y, type: number}
      - {name: z, type: number}
    returns: {type: "CreatureSnapshotWithDistance | nil", desc: "nil if no creature of that kind exists."}
    errors: []
    since: "1.0.0"

  - name: get_block
    namespace: world
    category: query
    summary: "The block at an integer position."
    params:
      - {name: x, type: integer}
      - {name: y, type: integer}
      - {name: z, type: integer}
    returns: {type: string, desc: "Snake_case block id -- see block_kinds. Positions outside the loaded/generated world, or above/below the vertical bounds, read as \"air\", never an error."}
    errors: []
    since: "1.0.0"

  - name: find_blocks
    namespace: world
    category: query
    summary: "Positions of every block of one kind within a radius of a point."
    params:
      - {name: kind, type: string, desc: "A block id from block_kinds, OR the special category alias \"wood\" (matches any tree species: oak_wood, spruce_wood, birch_wood, cherry_wood). Unlike find_creatures' kind, an unrecognized string here returns an EMPTY result, not \"match everything\" -- this asymmetry is a real gotcha, not a design you can rely on being consistent across query methods."}
      - {name: cx, type: integer}
      - {name: cy, type: integer}
      - {name: cz, type: integer}
      - {name: radius, type: number, desc: "Clamped into [0, find_radius_max]."}
    returns: {type: "BlockPos[]", desc: "Up to find_results_max entries; excess matches are silently dropped."}
    errors: []
    budget_ref: find_radius_max
    since: "1.0.0"

  - name: terrain_height
    namespace: world
    category: query
    summary: "The integer y of the topmost solid ground block at a column. Useful for placing/spawning things at the correct height instead of guessing."
    params:
      - {name: x, type: integer}
      - {name: z, type: integer}
    returns: {type: integer}
    errors: []
    since: "1.0.0"

  - name: distance
    namespace: world
    category: query
    summary: "Straight-line distance between two points. Prefer this over writing your own sqrt(dx*dx+dy*dy+dz*dz)."
    params:
      - {name: x1, type: number}
      - {name: y1, type: number}
      - {name: z1, type: number}
      - {name: x2, type: number}
      - {name: y2, type: number}
      - {name: z2, type: number}
    returns: {type: number}
    errors: []
    since: "1.0.0"

  # -- Actions --
  - name: chase
    namespace: world
    category: action
    summary: "Makes a creature move toward a point at increased speed. Call it again every tick to keep it chasing -- stop calling it and the creature reverts to normal wandering within about a third of a second (there is no separate \"stop chasing\" call)."
    params:
      - {name: creature_id, type: integer}
      - {name: x, type: number}
      - {name: y, type: number}
      - {name: z, type: number}
    returns: {type: nil, desc: "Always nil, even if creature_id doesn't exist -- there is no way to tell from Lua whether the call actually found the creature."}
    errors: []
    since: "1.0.0"

  - name: damage
    namespace: world
    category: action
    summary: "Reduces a creature's health. Fires on_death (to every module, not just the caller) if this brings health to zero or below, and despawns it."
    params:
      - {name: creature_id, type: integer}
      - {name: amount, type: number}
    returns: {type: nil, desc: "Always nil, whether or not creature_id exists."}
    errors: []
    since: "1.0.0"

  - name: destroy
    namespace: world
    category: action
    summary: "Removes a creature immediately regardless of remaining health, and fires on_death."
    params:
      - {name: creature_id, type: integer}
    returns: {type: nil, desc: "Always nil, whether or not creature_id exists."}
    errors: []
    since: "1.0.0"

  - name: spawn_creature
    namespace: world
    category: action
    summary: "Spawns a new creature at a position. sheep/chicken are passive (only ever move under a rule's chase, never attack). stone_golem is different: large, slow, and hostile -- entirely on its own, with no Lua involved, it closes on and periodically damages the nearest player within its aggro radius. Only spawn one when a hostile/dangerous creature is actually what the request wants."
    params:
      - {name: kind, type: string, enum_ref: creature_kinds, desc: "\"sheep\", \"chicken\", or \"stone_golem\"; anything else (including a typo) silently becomes \"sheep\" -- not an error."}
      - {name: x, type: number}
      - {name: y, type: number}
      - {name: z, type: number}
    returns: {type: "integer | nil", desc: "The new creature's id, or nil if this call's spawn budget is already used up."}
    errors: []
    budget_ref: creature_spawns_per_call
    since: "1.0.0"

  - name: spawn_creature_near_player
    namespace: world
    category: action
    summary: "Spawns a new creature at a random point within radius blocks of a player (horizontally; height snaps to terrain). Prefer this over spawn_creature plus your own random offset when the rule is about spawning near a specific player."
    params:
      - {name: player_id, type: integer}
      - {name: kind, type: string, enum_ref: creature_kinds, desc: "Same silent-default-to-sheep behavior as spawn_creature."}
      - {name: radius, type: number, desc: "Clamped into [1, find_radius_max] -- note the floor is 1, not 0, unlike the find_* methods."}
    returns: {type: "integer | nil", desc: "The new creature's id, or nil if player_id isn't connected OR the spawn budget is used up -- these two failure cases are indistinguishable from Lua."}
    errors: []
    budget_ref: creature_spawns_per_call
    since: "1.0.0"

  - name: replace_block
    namespace: world
    category: action
    summary: "Changes one block."
    params:
      - {name: x, type: integer}
      - {name: y, type: integer}
      - {name: z, type: integer}
      - {name: kind, type: string, desc: "A block id from block_kinds (e.g. \"air\" to clear a block)."}
    returns: {type: boolean, desc: "false if kind isn't a recognized block id, OR this call's block-edit budget is used up -- these two failure cases are indistinguishable from Lua. true otherwise."}
    errors: []
    budget_ref: block_edits_per_call
    since: "1.0.0"

  - name: set_weather
    namespace: world
    category: action
    summary: "Sets the weather directly."
    params:
      - {name: name, type: string, enum: [clear, rain]}
    returns: {type: nil, desc: "An unrecognized name is silently ignored -- not an error."}
    errors: []
    since: "1.0.0"

  - name: start_rain
    namespace: world
    category: action
    summary: "Shorthand for set_weather(\"rain\")."
    params: []
    returns: {type: nil}
    errors: []
    since: "1.0.0"

  - name: stop_rain
    namespace: world
    category: action
    summary: "Shorthand for set_weather(\"clear\")."
    params: []
    returns: {type: nil}
    errors: []
    since: "1.0.0"

  - name: set_time_of_day
    namespace: world
    category: action
    summary: "Sets the time of day directly."
    params:
      - {name: t, type: number, desc: "Wrapped into [0,1) (e.g. -0.25 and 1.25 both become 0.75), same scale as api.time_of_day."}
    returns: {type: nil}
    errors: []
    since: "1.0.0"

  - name: set_time_dawn
    namespace: world
    category: action
    summary: "Shorthand for set_time_of_day(0.0)."
    params: []
    returns: {type: nil}
    errors: []
    since: "1.0.0"

  - name: set_time_night
    namespace: world
    category: action
    summary: "Shorthand for set_time_of_day(0.5) -- sunset, night begins."
    params: []
    returns: {type: nil}
    errors: []
    since: "1.0.0"

  - name: broadcast
    namespace: world
    category: action
    summary: "Shows a message as a notification to every connected player, and logs it server-side. Use sparingly -- there is no per-call rate limit, only the shared time/instruction budget."
    params:
      - {name: message, type: string}
    returns: {type: nil}
    errors: []
    since: "1.0.0"

  - name: give_item
    namespace: world
    category: action
    summary: "Grants items straight into a player's Resources inventory (the panel populated by hand-gathering blocks), bypassing the world entirely. Only use this when the request explicitly asks to add to a player's inventory/resources -- for everything else (\"add 100 stone\", \"fill this area with water\"), prefer replace_block to place blocks in the world instead."
    params:
      - {name: player_id, type: integer, desc: "Target player (matches PlayerSnapshot.id)."}
      - {name: kind, type: string, desc: "A block id from block_kinds, but only the ones gatherable by hand (a resource, not e.g. \"air\" or \"water\") count -- anything else is rejected."}
      - {name: amount, type: integer, desc: "Clamped into [0, item_grant_max]."}
    returns: {type: boolean, desc: "false if kind isn't a grantable resource, player_id isn't connected, or amount clamped to 0 -- these failure cases are indistinguishable from Lua. true otherwise."}
    errors: []
    budget_ref: item_grant_max
    since: "1.1.0"

  - name: take_item
    namespace: world
    category: action
    summary: "Removes items from a player's Resources inventory -- the reverse of give_item. ONLY works for the host's own player right now: a remote player's inventory isn't tracked host-side (nothing reports it up), so this is a no-op for any other player_id. Prefer give_item for a remote player (granting doesn't need to know what they already have)."
    params:
      - {name: player_id, type: integer, desc: "Must be the host's own id (see summary) or this always fails."}
      - {name: kind, type: string, desc: "A block id from block_kinds; only a gatherable resource can be held at all."}
      - {name: amount, type: integer, desc: "How many to remove."}
    returns: {type: boolean, desc: "true only if player_id is the host AND it currently holds at least amount of kind (the whole amount is removed, never a partial take). false for every other case -- wrong player, unknown/ungrantable kind, or not enough held."}
    errors: []
    since: "1.2.0"

  - name: get_resource_count
    namespace: world
    category: query
    summary: "How much of one resource a player's inventory currently holds. Same host-only limitation as take_item -- a remote player's inventory isn't tracked host-side yet."
    params:
      - {name: player_id, type: integer, desc: "Must be the host's own id or this returns nil."}
      - {name: kind, type: string, desc: "A block id from block_kinds."}
    returns: {type: "integer | nil", desc: "nil if player_id isn't the host or kind isn't a real gatherable resource -- indistinguishable from Lua. Otherwise the count, which can legitimately be 0 (holds none, as opposed to nil meaning 'can't tell')."}
    errors: []
    since: "1.2.0"

  - name: damage_player
    namespace: world
    category: action
    summary: "Reduces a player's health, clamped at 0 -- there is no death/respawn system yet, so health just stops there."
    params:
      - {name: player_id, type: integer}
      - {name: amount, type: number}
    returns: {type: boolean, desc: "false if player_id isn't connected, true otherwise."}
    errors: []
    since: "1.2.0"

  - name: heal_player
    namespace: world
    category: action
    summary: "Restores a player's health, clamped at 100 (max_health)."
    params:
      - {name: player_id, type: integer}
      - {name: amount, type: number}
    returns: {type: boolean, desc: "false if player_id isn't connected, true otherwise."}
    errors: []
    since: "1.2.0"

  - name: set_poisoned
    namespace: world
    category: action
    summary: "Sets a player's poisoned flag directly -- true starts the 1-health-per-poison_tick_secs drain (see PlayerSnapshot.poisoned), false stops it (the hook a future medication item/effect would call; nothing in the engine calls this with false on its own yet)."
    params:
      - {name: player_id, type: integer}
      - {name: poisoned, type: boolean}
    returns: {type: boolean, desc: "false if player_id isn't connected, true otherwise."}
    errors: []
    since: "1.2.0"

  - name: set_player_speed
    namespace: world
    category: action
    summary: "Sets a player's speed_multiplier (applied to their base walk/sprint speed)."
    params:
      - {name: player_id, type: integer}
      - {name: multiplier, type: number, desc: "Clamped into [attribute_multiplier_min, attribute_multiplier_max]."}
    returns: {type: boolean, desc: "false if player_id isn't connected, true otherwise."}
    errors: []
    budget_ref: attribute_multiplier_max
    since: "1.2.0"

  - name: set_player_jump
    namespace: world
    category: action
    summary: "Sets a player's jump_multiplier (applied to their base jump speed)."
    params:
      - {name: player_id, type: integer}
      - {name: multiplier, type: number, desc: "Clamped into [attribute_multiplier_min, attribute_multiplier_max]."}
    returns: {type: boolean, desc: "false if player_id isn't connected, true otherwise."}
    errors: []
    budget_ref: attribute_multiplier_max
    since: "1.2.0"

# ---------------------------------------------------------------------------
# Event callbacks a module may define as global functions.
# ---------------------------------------------------------------------------
events:
  - name: on_tick
    required: true
    signature: "function on_tick(api)"
    frequency: "~10/sec, every tick_interval_secs, for as long as the module is enabled"
    desc: >
      Defines a RULE module. Required unless the module defines on_cast
      instead -- a module must define EXACTLY ONE of on_tick or on_cast,
      never both, never neither; Module::load rejects any other
      combination.
    since: "1.0.0"

  - name: on_cast
    required: false
    signature: "function on_cast(api, event)"
    event_type: CastEvent
    frequency: "Exactly once, immediately, when the host clicks Run in the Rules panel -- never on a timer, never re-run automatically."
    desc: >
      Defines an INSTANT SPELL module instead of a RULE: a one-time
      immediate action with no ongoing condition to check (e.g. "add 100
      stone", "spawn a dozen chickens around me", "heal me"), as opposed to
      a RULE's continuous "when/if/at night/while ..." behavior. Mutually
      exclusive with on_tick -- see on_tick's desc. Since it only runs
      once per click instead of ~10/sec, its per-call action budgets are
      higher than a RULE's -- see block_edits_per_cast_call and
      creature_spawns_per_cast_call.
    since: "1.1.0"

  - name: on_death
    required: false
    signature: "function on_death(api, event)"
    event_type: DeathEvent
    desc: >
      Fires once per creature death, from any cause (this module's or
      another enabled module's api.damage/api.destroy). Does NOT chain: if
      an on_death handler itself kills another creature, that second death
      does not fire on_death again within the same tick.
    since: "1.0.0"

  - name: on_block_break
    required: false
    signature: "function on_block_break(api, event)"
    event_type: BlockBreakEvent
    desc: "Fires once per real player-caused block break (mining). A rule's own replace_block calls, even ones that set a block to air, never trigger this."
    since: "1.0.0"
